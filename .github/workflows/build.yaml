name: Build and SonarQube Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    types:
      - opened

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarqube:
    name: Dart SonarQube Analysis

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate SonarQube Configuration
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -e

          echo "======================================"
          echo "Validating SonarQube Configuration"
          echo "======================================"

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "ERROR: SONAR_HOST_URL is empty."
            exit 1
          fi

          if [ -z "$SONAR_TOKEN" ]; then
            echo "ERROR: SONAR_TOKEN is empty."
            exit 1
          fi

          case "$SONAR_HOST_URL" in
            http://*|https://*)
              echo "SONAR_HOST_URL format: OK"
              ;;
            *)
              echo "ERROR: SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "SONAR_TOKEN: Configured"
          echo "SonarQube Configuration Validation Completed."

      - name: Check SonarQube Connectivity
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e

          echo "======================================"
          echo "Checking SonarQube Server Connectivity"
          echo "======================================"

          curl --fail \
               --silent \
               --show-error \
               --connect-timeout 10 \
               --max-time 30 \
               "${SONAR_HOST_URL%/}/api/server/version"

          echo ""
          echo "SonarQube Server Connection Successful."

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        with:
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=.
            -Dsonar.inclusions=**/*.dart
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
